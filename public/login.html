<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Staff sign in</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0f766e" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin.css" />
</head>
<body class="login-body">
  <main class="card login-card">
    <div class="brand">
      <div class="avatar" id="avatar">BS</div>
      <div>
        <h1>Staff sign in</h1>
        <p class="sub" id="bizLine">Appointment dashboard</p>
      </div>
    </div>

    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <div class="error" id="loginError" hidden></div>
      <button class="primary" type="submit" id="loginButton">Sign in</button>
    </form>

    <p class="hint">Customer booking? <a href="/">Go to the chat</a></p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/login.js"></script>
</body>
</html>
