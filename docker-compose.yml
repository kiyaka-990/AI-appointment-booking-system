services:
  booking:
    build: .
    image: appointment-booking:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /data/booking.db
    volumes:
      - booking-data:/data

volumes:
  booking-data:
