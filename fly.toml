# Fly.io deployment: fly volumes create booking_data --size 1 --region lhr
# then: fly secrets set STAFF_PASSWORD=... SESSION_SECRET=... RESEND_API_KEY=... TWILIO_AUTH_TOKEN=...
app = "appointa"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "3000"
  DATABASE_PATH = "/data/booking.db"
  NOTIFICATIONS_MODE = "auto"

[deploy]
  release_command = "node -e \"console.log('schema is created on first boot')\""

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "booking_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
